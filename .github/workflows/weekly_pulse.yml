name: Weekly Product Pulse

on:
  schedule:
    - cron: '30 2 * * 1' # Every Monday at 2:30 AM UTC (8:00 AM IST)
  workflow_dispatch: # Allow manual triggering

jobs:
  run-pulse:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Environment Files
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "${{ secrets.CREDENTIALS_JSON }}" | base64 -d > credentials.json
          echo "${{ secrets.TOKEN_JSON }}" | base64 -d > token.json
          echo "${{ secrets.TOKEN_GMAIL_JSON }}" | base64 -d > token_gmail.json

      - name: Run Pulse Orchestrator
        run: python pulse.py --product Groww
        env:
          PYTHONPATH: .

      - name: Upload Local Previews
        uses: actions/upload-artifact@v4
        with:
          name: pulse-previews
          path: reports/
